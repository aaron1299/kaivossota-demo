<style>
	/* Oswald, SIL Open Font License 1.1, tarjoillaan omalta palvelimelta.
	   Kapea teollinen leikkaus sopii kaivokseen, ja se erottaa pelin
	   jarjestelmafontilla tehdysta prototyypista. */
	@font-face {
		font-family: 'Oswald';
		src: url('./fontit/oswald-latin.woff2') format('woff2');
		font-weight: 200 700;
		font-display: swap;
		font-style: normal;
	}
	html, body {
		margin: 0; padding: 0; width: 100%; height: 100%;
		overflow: hidden; background: #0a0c11; color: #e8ecf2;
		font-family: 'Oswald', system-ui, "Segoe UI", Roboto, Arial, sans-serif;
		touch-action: none; overscroll-behavior: none;
		-webkit-tap-highlight-color: transparent;
	}
	#peli { display: block; width: 100%; height: 100%; touch-action: none; }
	/* Valikko skaalautuu ruudun korkeuden mukaan. Aiemmin se oli kiintean
	   kokoinen ja matalalla ruudulla otsikko leikkautui ylhaalta ja
	   viimeiset napit jaivat alareunan alle. Nyt kaikki mitat on sidottu
	   ruudun korkeuteen, ja jos tila loppuu silti, laatikko vierii. */
	#valikko {
		position: fixed; inset: 0; z-index: 10; display: none;
		align-items: center; justify-content: center;
		/* Kansikuva taustalle ja tumma verho paalle. Verho on valttamaton:
		   ilman sita valikon teksti ei erotu kuvasta, ja luettavuus voittaa
		   nayttavyyden aina. */
		background:
			linear-gradient(180deg, rgba(8,10,15,.78) 0%, rgba(8,10,15,.55) 40%, rgba(8,10,15,.93) 100%),
			url('./kuvat/kansi.png'),
			radial-gradient(circle at 50% 32%, #1d2733 0%, #0a0c11 70%);
		background-size: cover, cover, cover;
		background-position: center, center 42%, center;
		background-repeat: no-repeat;
		padding: clamp(10px, 2.5vh, 24px); box-sizing: border-box;
		overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
	}
	.laatikko {
		/* Leveys suhteessa valikkoon, ei ruutuun: valikolla on jo oma
		   reunus, ja 92vw sen paalla tyonsi laatikon ruudun yli kapealla
		   puhelimella. */
		width: min(100%, 420px); min-width: 0;
		display: flex; flex-direction: column;
		gap: clamp(6px, 1.2vh, 12px);
		text-align: center; margin: auto;
	}
	.laatikko h1 {
		margin: 0; letter-spacing: .06em;
		/* Otsikko on yksi pitka sana, joka ei katkea. Ilman ylarajaa se
		   levittaa koko laatikon ruudun yli kapealla puhelimella. */
		font-size: min(7.6vw, 6vh, 54px);
		white-space: nowrap;
		text-shadow: 0 2px 18px rgba(0,0,0,.75);
	}
	.alaotsikko {
		margin: -2px 0 0; color: #9aa6b6;
		font-size: clamp(10px, 1.5vh, 13px); letter-spacing: .22em;
	}
	.laatikko h2 { margin: 0 0 4px; font-size: clamp(19px, 3vh, 24px); }
	.laatikko p {
		margin: 0 0 4px; color: #c3ccd9;
		font-size: clamp(12px, 1.8vh, 15px); line-height: 1.45;
		text-shadow: 0 1px 10px rgba(0,0,0,.6);
	}
	.laatikko button {
		padding: clamp(9px, 1.6vh, 15px) 18px;
		border: 1px solid #33405326; border-radius: 10px;
		background: rgba(24,31,42,.88); color: #e8ecf2;
		font-size: clamp(14px, 2.1vh, 17px); font-weight: 600;
		font-family: inherit; cursor: pointer;
		backdrop-filter: blur(2px);
	}
	.laatikko button.korostus { background: #4fa3d8; border-color: #4fa3d8; color: #05101a; }
	.laatikko button:hover { border-color: #4a5a72; }
	.alapalkki { margin-top: 10px; }
	.alapalkki button { padding: 8px 14px; font-size: 13px; font-weight: 400; }
	.kortit { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
	.korttirivi {
		display: flex; justify-content: space-between; padding: 9px 12px;
		background: #151c26; border: 1px solid #222c3a; border-radius: 8px; font-size: 15px;
	}
	.korttirivi span { color: #4fa3d8; }
	.korttirivi.nyt { border-color: #4fa3d8; background: #14202c; }
	.porras { color: #9fd4ef; font-size: 15px; margin: 0; font-weight: 600; }
	.nousu { color: #ffd977; font-size: 20px; margin: 0; letter-spacing: .04em; }
	.palkki { height: 10px; border-radius: 5px; background: #131a24; overflow: hidden; }
	.palkki > div { height: 100%; background: linear-gradient(90deg, #4fa3d8, #9fd4ef); }
	.laatikko .leipa { text-align: left; white-space: pre-wrap; font-size: 14px; }
	.saldo { color: #8cc79b; font-size: 14px; margin: 0; }
	.ika { color: #6f7889; font-size: 12px; margin-top: 4px; }
	#valikko { overflow-y: auto; }
</style>
</head>
<body>
<canvas id="peli"></canvas>
<div id="valikko"></div>
<noscript>Tämä peli vaatii JavaScriptin. This game requires JavaScript.</noscript>
<script src="./peli.js?v=2d1a3d24fc" defer></script>
</body>
</html>
