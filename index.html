<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Kaivossota</title>

<style>
	/* Oswald, SIL Open Font License 1.1, tarjoillaan omalta palvelimelta.
	   Kapea teollinen leikkaus sopii kaivokseen, ja se erottaa pelin
	   jarjestelmafontilla tehdysta prototyypista. */
	@font-face {
		font-family: 'Oswald';
		src: url('./fontit/oswald-latin.woff2') format('woff2');
		font-weight: 200 700;
		font-display: swap;
		font-style: normal;
	}
	html, body {
		margin: 0; padding: 0; width: 100%; height: 100%;
		overflow: hidden; background: #0a0c11; color: #e8ecf2;
		font-family: 'Oswald', system-ui, "Segoe UI", Roboto, Arial, sans-serif;
		touch-action: none; overscroll-behavior: none;
		-webkit-tap-highlight-color: transparent;
	}
	#peli { display: block; width: 100%; height: 100%; touch-action: none; }
	#valikko {
		position: fixed; inset: 0; z-index: 10; display: none;
		align-items: center; justify-content: center;
		background: radial-gradient(circle at 50% 30%, #1d2733 0%, #0a0c11 70%);
		padding: 24px; box-sizing: border-box;
	}
	.laatikko {
		width: min(92vw, 420px); display: flex; flex-direction: column; gap: 12px;
		text-align: center;
	}
	.laatikko h1 { margin: 0; font-size: clamp(34px, 9vw, 54px); letter-spacing: .06em; }
	.laatikko h2 { margin: 0 0 6px; font-size: 24px; }
	.laatikko p { margin: 0 0 8px; color: #b6bfcd; font-size: 15px; line-height: 1.5; }
	.laatikko button {
		padding: 15px 18px; border: 1px solid #2a3444; border-radius: 10px;
		background: #1b2330; color: #e8ecf2; font-size: 17px; font-weight: 600;
		font-family: inherit; cursor: pointer;
	}
	.laatikko button.korostus { background: #4fa3d8; border-color: #4fa3d8; color: #05101a; }
	.alapalkki { margin-top: 10px; }
	.alapalkki button { padding: 8px 14px; font-size: 13px; font-weight: 400; }
	.kortit { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
	.korttirivi {
		display: flex; justify-content: space-between; padding: 9px 12px;
		background: #151c26; border: 1px solid #222c3a; border-radius: 8px; font-size: 15px;
	}
	.korttirivi span { color: #4fa3d8; }
	.korttirivi.nyt { border-color: #4fa3d8; background: #14202c; }
	.porras { color: #9fd4ef; font-size: 15px; margin: 0; font-weight: 600; }
	.nousu { color: #ffd977; font-size: 20px; margin: 0; letter-spacing: .04em; }
	.palkki { height: 10px; border-radius: 5px; background: #131a24; overflow: hidden; }
	.palkki > div { height: 100%; background: linear-gradient(90deg, #4fa3d8, #9fd4ef); }
	.laatikko .leipa { text-align: left; white-space: pre-wrap; font-size: 14px; }
	.saldo { color: #8cc79b; font-size: 14px; margin: 0; }
	.ika { color: #6f7889; font-size: 12px; margin-top: 4px; }
	#valikko { overflow-y: auto; }
</style>
</head>
<body>
<canvas id="peli"></canvas>
<div id="valikko"></div>
<noscript>Tämä peli vaatii JavaScriptin. This game requires JavaScript.</noscript>
<script src="./peli.js?v=9da74cfe24" defer></script>
</body>
</html>
